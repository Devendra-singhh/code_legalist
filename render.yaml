services:
  - type: web
    name: codelegalist-backend
    runtime: python
    rootDir: chatbot/backend
    plan: free
    pythonVersion: "3.10"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: IK_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: PORT
        value: 8080
    autoDeploy: true
    healthCheckPath: /health
