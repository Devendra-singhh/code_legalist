services:
  - type: web
    name: legal-assistant-backend
    runtime: python
    rootDir: chatbot/backend
    plan: free
    buildCommand: pip install numpy==1.24.3 && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: IK_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
    autoDeploy: true
